name: LiquidGlass
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "18.0"
targets:
  LiquidGlass:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Shared
    info:
      path: BuildSupport/App-Info.plist
      properties:
        CFBundleDisplayName: LiquidGlass
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "3"
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "匯入相簿照片作為 iOS 原生與 Metal 液態玻璃的即時折射背景。"
        CFBundleURLTypes:
          - CFBundleURLName: com.custom.liquidglass
            CFBundleURLSchemes:
              - liquidglass
    dependencies:
      - target: LiquidGlassWidget
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.liquidglass
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_MODULES: YES
        MTL_FAST_MATH: YES
        CODE_SIGNING_ALLOWED: NO

  LiquidGlassWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WidgetSources
      - path: Shared
    info:
      path: BuildSupport/Widget-Info.plist
      properties:
        CFBundleDisplayName: LiquidGlassWidget
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.liquidglass.widget
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_MODULES: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
